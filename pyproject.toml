[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ion-gym"
dynamic = ["version"]
description = "Independent, self-contained ion-optics simulation toolkit (solvers, tracers, geometry, and interactive viz)."
readme = "README.md"
license = {file = "LICENSE"}
# Add `email = "..."` here if you want a contact address published
# with the package metadata; omitted rather than guessed.
authors = [{name = "Brian Clowers"}]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
]
requires-python = ">=3.11"
# Runtime dependencies mirror requirements.txt. Core is always needed; the
# interactive app + STL/CAD path pull the rest. Kept unpinned here on purpose
# (the toolkit is developed against a conda env, Q2_2026) — pinning belongs in
# a lockfile, not the package metadata.
dependencies = [
    # 2.x: np.trapezoid (viz.ensemble_figs) has no numpy 1 name
    "numpy>=2",
    "scipy",
    "numba",
    "panel",
    # draggable split between the dashboard's control and plot panes
    "panel-splitjs",
    "plotly",
    "bokeh",
    "trimesh",
    "manifold3d",
    "psutil",
    # metal outlines in the dashboard's geometry preview and the editor's
    # contours (viz_core.mask_outline_mm, edit.contours)
    "contourpy",
    # static figures (viz_core.render_mpl and the figure modules), used by
    # the notebooks, reports and panel banks
    "matplotlib",
]

# The dependency list lives only here: requirements.txt is the one line
# `-e .[all]`, so the two install routes are the same environment by
# construction (tests/test_package_metadata.py holds that).
[project.optional-dependencies]
editor = ["contourpy"]
# jupyterlab: a server to open the notebooks with; without it the extra
# installed what the notebooks import but nothing to run them in.
notebooks = ["cma", "nbformat", "jupyter_bokeh", "jupyterlab"]
# The gate suite. pytest is not only the fast-suite runner: one SHIPPED
# script gate (test_staged_flight) imports it for its `slow` marker, so
# `run_gates.py` fails with an ImportError on an install that lacks it --
# reported as a gate FAILURE, which reads as a broken tree rather than a
# missing package. Declared here so the suite is installable by name.
# networkx: trimesh's path traversal needs it, and test_stl_rods sections
# the rod meshes through that path; ion_gym itself never reaches it.
gates = ["pytest", "networkx"]
# PE frame export (ion_gym.viz.pe_view.save_pe_frames) renders through
# kaleido, which also needs a Chrome/Chromium binary. Optional: nothing
# else imports it, and save_pe_frames refuses by name without it.
export = ["kaleido>=1"]
# CAD export (ion_gym.io.jcad_export): jupytercad-core validates emitted
# .jcad documents against the official schema; cadquery evaluates a
# .jcad into a STEP assembly. Both are imported INSIDE the functions that
# need them, so the package imports without them. Kept out of `all`:
# cadquery pulls the OpenCascade (OCP) wheels, a heavy install that no
# solve or flight path needs.
# kiutils: pure-Python KiCad file writer for flatapole_kicad (tiny).
cad = ["cadquery", "jupytercad-core", "kiutils"]
all = ["contourpy", "cma", "nbformat", "jupyter_bokeh", "jupyterlab",
       "pytest", "networkx", "kaleido>=1"]

[tool.setuptools]
# Packages are LISTED, not discovered: discovery cannot map the repo-root
# examples/ folder into the wheel, and an installed package without its
# example decks cannot open the app (it has no default deck). The example
# decks therefore ship as the data package ion_gym.examples, mapped from
# examples/ below; ion_gym.io.paths.examples_dir() reads them there when
# there is no checkout. tests/test_package_manifest.py refuses a
# subpackage missing from this list and a package file no package-data
# pattern covers. Gates (tests/), tools/, notebooks/ and per-machine
# outputs are repo-root siblings and are deliberately NOT packaged.
packages = [
    "ion_gym",
    "ion_gym.cad",
    "ion_gym.edit",
    "ion_gym.io",
    "ion_gym.physics",
    "ion_gym.projects",
    "ion_gym.ui",
    "ion_gym.viz",
    "ion_gym.examples",
]

[tool.setuptools.package-dir]
"ion_gym.examples" = "examples"

[tool.setuptools.package-data]
# SDS diffusion tables live beside the code that loads them
# (build_planar / tracer3d read them from their own module dir). They MUST
# ship inside the package, or the collision path raises FileNotFoundError.
"ion_gym.physics" = ["*.dat", "ccs_fit_n2_z1.json"]
# The vendored three.js the 3-D viewer loads offline, with its LICENSE and
# manifest; without it the viewer falls back to a CDN.
"ion_gym.edit" = ["vendor/three/**/*"]
# Example decks, their STL meshes, and the folder READMEs.
"ion_gym.examples" = ["**/*.json", "**/*.stl", "**/*.STL", "**/*.md"]

[project.scripts]
ion-gym = "ion_gym.cli:main"

[tool.setuptools.dynamic]
version = {attr = "ion_gym.__version__"}

[tool.pytest.ini_options]
# Tiered public suite: a bare
# `pytest` is the FAST correctness suite; the expensive physics and
# instrument gates run deliberately, not by accident.
#   pytest                       -> fast suite (default)
#   pytest -m slow               -> the expensive physics gates
#   pytest -m "slow or not slow" -> everything
#   python tests/run_gates.py    -> the tiered gate runner (numerical
#                                   certification, tier 2/3)
markers = [
    "slow: expensive physics gate (minutes-scale); excluded from the default run",
    "instrument: full-instrument flight or acceptance sweep; excluded from the default run",
]
addopts = "-m 'not slow and not instrument'"
# A bare root `pytest` walks every directory without this pin, which
# collects the retired suites (quarantined by NAME, not by config)
# and dies on 4 collection errors before running one shipped test
# (measured). The shipped suite lives in tests/; retired and
# study suites are run explicitly by path when wanted.
testpaths = ["tests"]
